<script>
const D=[[1, "Core set", "Which cell type is the main bridge between the innate and adaptive immune systems?", ["Neutrophil", "Dendritic cell", "Eosinophil", "Natural killer cell"], 1, "Dendritic cells phagocytose antigen (innate) then present it on MHC to naive T cells (adaptive). Neutrophils and eosinophils don't present antigen to naive T cells; NK cells are cytotoxic innate cells.", ""], [1, "Core set", "A key characteristic of the secondary immune response is:", ["Long lag phase with mainly IgM", "Short lag phase with rapid IgG production", "Same kinetics as the primary response", "Lower-affinity antibody than primary"], 1, "Memory cells give a lag of ~1–3 days, faster rise, higher affinity and mostly IgG. Primary responses have longer lag and IgM first.", ""], [1, "Core set", "Which immunoglobulin appears first in a primary infection?", ["IgG", "IgE", "IgM", "IgA"], 2, "IgM is produced first (before class switching). IgG dominates later and in the secondary response.", ""], [1, "Core set", "Cell-mediated immunity is mediated mainly by:", ["Neutrophils", "B cells", "T cells", "Eosinophils"], 2, "T lymphocytes (CD4 helper, CD8 cytotoxic) drive cell-mediated immunity against intracellular microbes. B cells make antibodies (humoral).", ""], [1, "Core set", "Which statement correctly contrasts humoral and cell-mediated immunity?", ["Humoral targets intracellular microbes; cell-mediated targets extracellular ones", "Both target only extracellular microbes", "Humoral targets extracellular microbes; cell-mediated targets intracellular ones", "Both are mediated by antibodies"], 2, "Antibodies neutralise extracellular microbes; T cells eliminate infected cells and activate phagocytes against intracellular microbes.", ""], [1, "Core set", "The innate immune system is characterised by:", ["Receptors generated by gene rearrangement", "Germline-encoded receptors and rapid response", "Slow response with long-lasting memory", "Antibody production by plasma cells"], 1, "Innate receptors (PRRs) are germline-encoded, respond within minutes–hours, and have no true memory. Clonal receptors and memory are adaptive.", ""], [2, "Core set", "Which is a chemical barrier of the immune system?", ["Lysozyme in tears and saliva", "Ciliary movement", "Intact skin epithelium", "Commensal flora"], 0, "Lysozyme is a chemical (enzymatic) barrier. Cilia and intact epithelium are physical; commensals are biological competition.", ""], [2, "Core set", "Opsonins mainly function to:", ["Block pathogen entry through mucous membranes", "Coat microbes to enhance phagocytosis", "Directly form pores in bacteria", "Induce mast cell degranulation"], 1, "Opsonins (IgG, C3b, CRP) coat microbes so phagocytes bind them better. (The 2023–24 key stating mucosal blocking is incorrect.)", ""], [2, "Core set", "CRP primarily:", ["Opsonizes pathogens and activates complement", "Forms pores in the target cell membrane", "Presents peptides to naive helper T cells", "Kills infected cells with perforin and granzymes"], 0, "CRP is an acute-phase protein binding phosphocholine; it opsonizes and activates the classical complement pathway. It is induced by IL-6.", ""], [2, "Core set", "The membrane attack complex of complement:", ["Forms pores that lyse the pathogen", "Coats microbes to aid ingestion", "Attracts neutrophils to the site", "Triggers mast cell degranulation"], 0, "C5b–C9 insert into membranes forming pores → lysis. Opsonization is C3b; chemotaxis is C5a.", ""], [2, "Core set", "CD16 and CD56 identify which cells in flow cytometry?", ["B cells", "Cytotoxic T cells", "Natural killer cells", "Monocytes"], 2, "NK cells are CD16⁺CD56⁺ (CD16 = FcγRIII, used for ADCC). B cells are CD19; CD8 marks cytotoxic T cells.", ""], [2, "Core set", "Chemokines regulate:", ["Antibody class switching", "Migration of leukocytes", "Complement activation", "Antigen processing"], 1, "Chemokines are chemotactic cytokines directing leukocyte migration to inflamed sites.", ""], [2, "Core set", "Excessive TNF-α production results in:", ["Profound generalised immunodeficiency", "Intravascular thrombosis and shock", "Induction of central T-cell tolerance", "Increased antibody affinity"], 1, "Systemic TNF causes vasodilation, increased permeability, thrombosis and septic-type shock (cytokine storm).", ""], [2, "Core set", "The first cells recruited to a site of acute inflammation are:", ["Macrophages", "Neutrophils (PMNs)", "Basophils", "B cells"], 1, "Neutrophils arrive first (hours), followed by monocytes/macrophages.", ""], [2, "Core set", "A defect in NADPH oxidase causing failure of the oxidative burst leads to:", ["Severe combined immunodeficiency", "Bruton agammaglobulinemia", "Chronic granulomatous disease", "DiGeorge syndrome"], 2, "CGD: phagocytes ingest but can't generate reactive oxygen species, causing recurrent infections and granulomas.", ""], [2, "Core set", "NLRP3 inflammasome activation leads to release of:", ["IL-1β and IL-18", "IL-4 and IL-5", "IFN-γ and TNF", "IL-2 and IL-7"], 0, "Inflammasome-activated caspase-1 cleaves pro-IL-1β and pro-IL-18 into active forms.", ""], [2, "Core set", "Which receptor senses cytosolic DNA and signals via STING to induce type I interferon?", ["TLR4", "cGAS", "RIG-I", "NOD2"], 1, "cGAS binds cytosolic DNA, makes cGAMP, which activates STING → IFN-I. RIG-I senses RNA; TLR4 senses LPS.", ""], [2, "Core set", "Which cell kills targets with reduced MHC I without prior exposure?", ["CD8 T cell", "B cell", "NK cell", "Neutrophil"], 2, "NK cells are activated by missing self (low MHC I) and need no prior sensitisation.", ""], [2, "Core set", "Which immunoglobulin sensitises mast cells and triggers degranulation?", ["IgA", "IgE", "IgG", "IgM"], 1, "IgE binds FcεRI on mast cells/basophils; cross-linking by antigen causes degranulation.", ""], [2, "Core set", "Which is an adhesion molecule used in leukocyte binding?", ["LFA-1", "CD19", "RAG1", "Lysozyme"], 0, "LFA-1 (integrin) binds ICAM-1 on endothelium and APCs.", ""], [3, "Core set", "Which CD marker identifies B cells in peripheral blood?", ["CD3", "CD8", "CD16", "CD19"], 3, "CD19 is a pan-B marker. CD3 marks T cells; CD16 NK cells.", ""], [3, "Core set", "Affinity maturation in B cells involves:", ["Somatic hypermutation followed by selection", "Random receptor loss during clonal deletion", "Receptor rearrangement by RAG1/RAG2 only", "Complement-mediated opsonization of antigen"], 0, "In germinal centres, mutations in V genes plus selection by follicular dendritic cells/Tfh raise antibody affinity.", ""], [3, "Core set", "A T-dependent antigen is typically a:", ["Protein", "Lipid", "Polysaccharide", "Nucleic acid"], 0, "Proteins yield peptides presented on MHC II to Th cells. Pure polysaccharides are generally T-independent.", ""], [3, "Core set", "Effector B cells (plasma cells) mainly produce:", ["Cytokines", "Antibody", "MHC I", "TCR"], 1, "Plasma cells are antibody factories (the Endorphin key 'cytokines' conflicts with lecture).", ""], [3, "Core set", "Naive B cells co-express which surface immunoglobulins?", ["IgM and IgD", "IgG and IgA", "IgA and IgM", "IgE and IgG"], 0, "Alternative splicing of one transcript gives IgM + IgD on naive B cells.", ""], [3, "Core set", "IL-12 drives differentiation of naive CD4 T cells into:", ["Th2", "Th17", "Th1", "Treg"], 2, "IL-12 → Th1; IL-4 → Th2; TGF-β + IL-6 → Th17.", ""], [4, "Core set", "Which organ traps and concentrates blood-borne antigens?", ["Lymph node", "Spleen", "Thymus", "Peyer's patch"], 1, "Spleen filters blood; lymph nodes filter lymph.", ""], [4, "Core set", "The Bursa of Fabricius is:", ["The site of B-cell production in birds", "The site of T-cell maturation in mammals", "A mucosal lymphoid tissue in humans", "A mucosal organ producing T cells in birds"], 0, "B cells were named for the Bursa in birds (near the cloaca); in mammals the bone marrow is the B-cell site.", ""], [4, "Core set", "In GALT, which cell samples luminal antigens?", ["M cell", "Goblet cell", "Hepatocyte", "Keratinocyte"], 0, "M cells transport antigen across epithelium to underlying Peyer's patch lymphocytes.", ""], [4, "Core set", "High endothelial venules:", ["Drain lymph from tissues into the cortex", "Allow lymphocyte entry from blood into lymph nodes", "Secrete antibody into the medullary sinuses", "Store mature lymphocytes inside the capsule"], 1, "HEVs in the paracortex mediate rolling, adhesion and diapedesis (homing).", ""], [4, "Core set", "B cells reside mainly in which region of a lymph node?", ["Paracortex", "Medulla", "Cortex (follicles)", "Capsule"], 2, "Follicles in the cortex hold B cells; paracortex holds T cells; medulla holds plasma cells.", ""], [4, "Core set", "Which immunoglobulin is responsible for mucosal transport?", ["IgE", "IgD", "IgA", "IgG"], 2, "Dimeric IgA with secretory piece is transported across epithelia.", ""], [4, "Core set", "Hassall's corpuscles are found in the:", ["Spleen", "Thymus", "Tonsil", "Lymph node"], 1, "Medulla of the thymus.", ""], [5, "Core set", "Which enzymes mediate V(D)J recombination?", ["RAG1/RAG2", "ZAP-70", "AIRE", "Calnexin"], 0, "RAG1/2 cut at recombination signal sequences in BCR and TCR genes.", ""], [5, "Core set", "The costimulatory second signal in T-cell activation is between:", ["TCR and MHC", "CD28 and B7 (CD80/86)", "LFA-1 and ICAM-1", "CD4 and MHC I"], 1, "CD28 on T cells binds B7 on APCs. TCR:MHC is signal 1.", ""], [5, "Core set", "Positive selection occurs in the thymic:", ["Medulla", "Subcapsular only", "Cortex", "Hassall's corpuscle"], 2, "Cortical epithelial cells test for self-MHC recognition; negative selection mainly occurs in the medulla.", ""], [5, "Core set", "Double-negative thymocytes are:", ["CD4⁺CD8⁺", "CD4⁻CD8⁻", "CD4⁺ only", "CD8⁺ only"], 1, "They express neither CD4 nor CD8 (cortex); next they become double positive.", ""], [5, "Core set", "AIRE's role in the thymus is to:", ["Rearrange TCR genes at the double-negative stage", "Display self antigens for negative selection", "Activate ZAP-70 downstream of the TCR", "Supply IL-7 to developing thymocytes"], 1, "AIRE in medullary TECs drives self-antigen expression to delete autoreactive T cells.", ""], [5, "Core set", "Superantigens cause:", ["Activation of a large percentage of T cells", "Activation of a single antigen-specific T-cell clone", "Induction of tolerance in self-reactive T cells", "Selective killing of plasma cells by NK cells"], 0, "They link MHC II to TCR Vβ outside the groove, polyclonally activating many T cells.", ""], [5, "Core set", "Heavy-chain gene rearrangement occurs at which B-cell stage?", ["Pro-B cell", "Immature B cell", "Mature B cell", "Plasma cell"], 0, "Pro-B: heavy chain; pre-B: light chain rearrangement follows.", ""], [6, "Core set", "Which MHC class presents endogenous peptides to CD8⁺ T cells?", ["MHC class I", "MHC class II", "Both only on APCs", "Neither"], 0, "MHC I with endogenous peptides → CD8; MHC II with exogenous peptides → CD4.", ""], [6, "Core set", "A collection of alleles on a single chromosome is a:", ["Genotype", "Haplotype", "Locus", "Phenotype"], 1, "Haplotypes are inherited as blocks, one from each parent.", ""], [6, "Core set", "Haptens become immunogenic when:", ["Given alone in a very high dose", "Bound to a large carrier molecule", "Administered after heat denaturation", "Mixed with MHC class I molecules"], 1, "Haptens are antigenic but not immunogenic until carrier-bound (e.g. penicillin).", ""], [6, "Core set", "Two different alleles at one HLA locus is called:", ["Homozygous", "Heterozygous", "Haplotype", "Polyclonal"], 1, "Different alleles at the same locus = heterozygous.", ""], [6, "Core set", "Adjuvants:", ["Suppress the response to an immunogen", "Enhance response to an immunogen", "Act as haptens without a carrier", "Replace the need for a carrier protein"], 1, "They boost immunogenicity of vaccines/antigens.", ""], [6, "Core set", "The MHC class I domain that binds CD8 is:", ["α1", "α2", "α3", "β1"], 2, "α3 binds CD8; α1+α2 form the groove.", ""], [6, "Core set", "Contact dermatitis is which hypersensitivity type?", ["Type I", "Type II", "Type III", "Type IV"], 3, "Delayed-type, T-cell mediated, 24–72 h.", ""], [1, "Core set", "Which immunoglobulin is given for passive immunity in rabies prophylaxis?", ["IgA", "IgM", "IgG", "IgE"], 2, "Human rabies immunoglobulin is IgG: long half-life, good tissue distribution. IgM is short-lived; IgA is mucosal; IgE mediates allergy.", ""], [1, "Core set", "Which statement is NOT part of innate immunity?", ["Phagocytosis by neutrophils", "Complement activation", "Activation of B lymphocytes", "Lysozyme secretion"], 2, "B-cell activation by specific antigen is adaptive; the others are innate.", ""], [1, "Core set", "Which cells carry antigen-specific receptors?", ["Neutrophils", "Eosinophils", "Natural killer cells", "Lymphocytes (B and T)"], 3, "Only B and T cells have clonally distributed antigen-specific receptors; NK cells use germline-encoded receptors.", ""], [1, "Core set", "Which immunoglobulin is almost exclusively membrane-bound?", ["IgG", "IgD", "IgA", "IgE"], 1, "IgD is mainly a B-cell surface receptor with trace serum levels.", ""], [1, "Core set", "Which immunoglobulin is most abundant in serum and crosses the placenta?", ["IgG", "IgM", "IgA", "IgD"], 0, "IgG is ~75% of serum Ig and uses FcRn for placental transfer. IgM is a pentamer too large to cross.", ""], [1, "Core set", "The clonal selection hypothesis states that:", ["Antigen instructs lymphocytes to alter their receptors", "Antigen selects pre-existing clones to expand", "Every lymphocyte responds to every antigen", "Antibody is made before antigen exposure"], 1, "Each lymphocyte has one receptor specificity; antigen selects and expands matching clones.", ""], [1, "Core set", "The state in which part of the immune system is deficient or non-functional is:", ["Tolerance", "Autoimmunity", "Immunodeficiency", "Hypersensitivity"], 2, "Immunodeficiency is deficiency; tolerance is non-reaction to self; autoimmunity is reaction to self.", ""], [1, "Core set", "Ability to distinguish self from non-self without reacting to self is:", ["Tolerance", "Immunodeficiency", "Autoimmunity", "Anaphylaxis"], 0, "Tolerance; its failure causes autoimmunity.", ""], [1, "Core set", "Which are soluble molecules of acquired immunity?", ["Antibodies", "Lysozyme", "Interferons", "Defensins"], 0, "Antibodies are the soluble effectors of adaptive (humoral) immunity; the others are innate.", ""], [2, "Core set", "In the lectin pathway, MBL binds to:", ["Mannose on the pathogen surface", "IgG bound to the pathogen surface", "C3b deposited on the pathogen", "Phosphocholine on apoptotic cells"], 0, "MBL is a protein (collectin) recognising mannose; the classical pathway uses antibody.", ""], [2, "Core set", "The alternative and lectin pathways converge at:", ["C4", "C2", "C3", "C5"], 2, "Both generate a C3 convertase; C3 cleavage gives C3b.", ""], [2, "Core set", "Which molecule binds the bacterial surface to start the alternative pathway?", ["Factor D", "C3b", "Factor B alone", "C1q"], 1, "C3b deposits on the surface, then binds factor B, which factor D cleaves.", ""], [2, "Core set", "In the leukocyte migration sequence, the step after rolling is:", ["Diapedesis", "Chemotaxis", "Adhesion", "Margination"], 2, "Order: margination → rolling → adhesion → diapedesis → chemotaxis.", ""], [2, "Core set", "Major basic protein is produced mainly by:", ["Eosinophils", "Neutrophils", "Basophils", "Macrophages"], 0, "Eosinophil granule protein used against parasites.", ""], [2, "Core set", "Which Ig binds Fc receptors on phagocytes to aid opsonization?", ["IgM", "IgG", "IgA", "IgE"], 1, "FcγR binds IgG-coated microbes.", ""], [2, "Core set", "NK cells differ from B and T cells in that they:", ["Use gene-rearranged antigen receptors", "Kill without antigen-specific receptors", "Require thymic education to function", "Secrete antibody after activation"], 1, "They use germline-encoded activating/inhibitory receptors.", ""], [2, "Core set", "Redness, heat, swelling and pain are:", ["Signs of inflammation", "Signs of tolerance", "Complement products", "Phases of phagocytosis"], 0, "Rubor, calor, tumor, dolor.", ""], [2, "Core set", "Which cytokine is a major inducer of fever?", ["IL-4", "IL-1", "IL-5", "TGF-β"], 1, "IL-1 (also TNF and IL-6) acts on the hypothalamus, so the key is not unique.", ""], [2, "Core set", "Raised CRP and IL-6 indicates:", ["Acute-phase response", "Central tolerance", "Affinity maturation", "Anergy"], 0, "IL-6 stimulates hepatocytes to make CRP.", ""], [3, "Core set", "The Fas–FasL pathway kills targets by:", ["Forming pores with complement C5b-9", "Triggering apoptosis caspase cascades", "Engulfing the target by phagocytosis", "Coating the target with C3b opsonin"], 1, "FasL on CTL/NK engages Fas on the target, activating caspases.", ""], [3, "Core set", "The germinal centre light zone is where:", ["FDCs display antigen for B-cell selection", "Centroblasts proliferate and mutate", "Naive T cells enter from the blood", "Thymocytes undergo negative selection"], 0, "Light zone: selection with FDCs/Tfh; dark zone: proliferation and mutation.", ""], [3, "Core set", "T-cell-independent antigens:", ["Efficiently induce memory B cells", "Show limited affinity maturation", "Always require MHC II presentation", "Mostly induce strong IgG responses"], 1, "Without T help, class switching and affinity maturation are limited.", ""], [3, "Core set", "Bruton agammaglobulinemia features:", ["Absent B cells and low immunoglobulins", "Absent T cells and a missing thymus", "Defective oxidative burst in neutrophils", "Normal B cells with low IgA only"], 0, "BTK mutation blocks B-cell development; T cells are normal.", ""], [4, "Core set", "Which cytokine is crucial for B-lineage commitment from lymphoid progenitors?", ["IL-7", "IL-4", "IL-12", "IFN-γ"], 0, "IL-7 from marrow stromal cells supports early lymphocytes.", ""], [4, "Core set", "Antigen-independent lymphopoiesis occurs in:", ["Primary lymphoid organs", "Secondary lymphoid organs", "Mucosa-associated tissues", "Peripheral lymph nodes"], 0, "Bone marrow and thymus; secondary organs host antigen-dependent responses.", ""], [4, "Core set", "The largest secondary lymphoid organ is the:", ["Lymph node", "Thymus", "Spleen", "Tonsil"], 2, "The spleen.", ""], [4, "Core set", "MALT stands for:", ["Mucosa-associated lymphoid tissue", "Marrow-associated lymphocyte tissue", "Macrophage-activated lymphoid tissue", "Mucosal antibody tissue"], 0, "Includes GALT, BALT and urogenital lymphoid tissue.", ""], [5, "Core set", "ZAP-70 functions in TCR signalling by:", ["Phosphorylating LAT", "Cutting DNA", "Presenting peptide", "Binding B7"], 0, "ZAP-70 phosphorylates LAT to assemble the signalling complex.", ""], [5, "Core set", "Which pathway directs progenitors to the T-cell lineage?", ["Notch signalling", "JAK-STAT5", "NF-κB only", "Fas"], 0, "Notch ligands in the thymus commit T lineage.", ""], [5, "Core set", "Receptor editing modifies the:", ["Variable light chain", "Constant heavy chain", "MHC I", "CD28"], 0, "Autoreactive immature B cells re-rearrange the light chain.", ""], [5, "Core set", "Which immunoglobulin is on immature B cells?", ["IgM", "IgD", "IgG", "IgA"], 0, "IgM appears first; IgD joins at the mature stage.", ""], [5, "Core set", "LFA-1/ICAM-1 mediate:", ["T cell binding to APCs", "Antibody class switching", "Complement lysis", "V(D)J joining"], 0, "They stabilise the immune synapse.", ""], [5, "Core set", "A polyclonal activator is:", ["Lipopolysaccharide (LPS)", "Hapten–carrier complex", "Adjuvant-bound protein", "Native collagen fibres"], 0, "LPS stimulates many B-cell clones regardless of specificity.", ""], [6, "Core set", "The MHC I peptide groove is formed by:", ["α1 and α2", "α1 and α3", "α2 and β2m", "α3 and β2m"], 0, "For MHC II the groove is α1 + β1.", ""], [6, "Core set", "Which is NOT encoded by the HLA genes?", ["HLA dterm 2023–24", "Which best describes immune memory?", ["Remembering past antigens and responding better on re-exposure", "Responding identically every time an antigen is encountered", "Keeping intact antigens permanently inside macrophages", "Making antibody continuously without any antigen contact"], 0, "Memory cells give faster, stronger, higher-affinity responses.", ""], [1, "Midterm 2023–24", "Primary function of T lymphocytes in cell-mediated immunity:", ["Destroy infected cells and activate phagocytes", "Secrete antibody into extracellular fluid", "Form the membrane attack complex", "Opsonize microbes for ingestion"], 0, "CTLs kill infected cells; Th1 cells activate macrophages.", ""], [1, "Midterm 2023–24", "Main purpose of the clonal selection hypothesis:", ["Show how specific lymphocytes proliferate after antigen exposure", "Show how antigen changes receptor specificity of lymphocytes", "Show how innate receptors are generated before infection", "Show how antibodies cross the placenta to the foetus"], 0, "It explains why a response is specific: only matching clones are expanded.", ""], [1, "Midterm 2023–24", "Which is NOT part of the innate immune response?", ["Activation of B lymphocytes", "Natural killer cell cytotoxicity", "Complement-mediated lysis", "Neutrophil phagocytosis"], 0, "Activation of B cells is adaptive.", ""], [1, "Midterm 2023–24", "What happens to a lymphocyte that meets its specific antigen in a lymph node?", ["It is activated, proliferates and differentiates", "It is deleted by negative selection", "It returns unchanged to the blood", "It converts into an antigen-presenting cell"], 0, "Antigen recognition triggers clonal expansion into effector and memory cells.", ""], [1, "Midterm 2023–24", "A key characteristic of the secondary response:", ["Short lag phase with rapid IgG production", "Long lag phase with IgM predominance", "Short lag phase with IgE predominance", "Slow IgA rise limited to mucosa"], 0, "Memory cells give a quick, IgG
