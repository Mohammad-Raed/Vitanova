<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitanova Learning Hub</title>
<style>
:root{--bg:#17111f;--card:#251b34;--line:#423052;--txt:#f8f2ff;--muted:#c7b7df;--purple:#ad8ad8;--mint:#60dfce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:linear-gradient(115deg,#58377e 0%,#432d68 53%,#285c6a 100%);text-align:center;padding:65px 20px 62px}header .brand{font-size:13px;letter-spacing:3px;color:#ffe09b;font-weight:800}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(44px,6vw,70px);margin:20px 0 14px}header p{font-size:19px;line-height:1.7;margin:0;color:#eee2fc}.pill{display:inline-block;border:1px solid #ffffff40;border-radius:40px;padding:10px 17px;margin-top:25px;font-size:13px;background:#ffffff13}main{max-width:1150px;margin:auto;padding:42px 24px 85px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:2px}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:25px;flex-wrap:wrap}h2{font-size:clamp(30px,4vw,39px);margin:9px 0 0}.count{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:10px 14px;background:#ffffff08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;min-height:250px}.icon{background:#342545;border-radius:17px;display:grid;place-items:center;width:58px;height:58px;font-size:25px;margin-bottom:20px}.tag{font-size:11px;letter-spacing:.5px;font-weight:800;color:#c79cf3;background:#372847;border-radius:30px;padding:6px 11px;align-self:start}.card h3{font-size:21px;line-height:1.35;margin:13px 0 8px}.card p{color:var(--muted);line-height:1.65;font-size:14px;margin:0 0 20px;flex:1}.action{display:inline-block;align-self:start;padding:12px 17px;border-radius:12px;background:var(--purple);color:#fff;font-weight:750;text-decoration:none;border:0;font-size:14px;cursor:pointer}.action:hover{filter:brightness(1.1)}.action:focus-visible,.back:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.back{display:inline-block;color:#dfc8ff;text-decoration:none;font-weight:700;margin-bottom:26px}.empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{text-align:center;padding:24px;color:#9f8db6;font-size:13px}a{color:inherit}@media(max-width:550px){header{padding:44px 16px}header p{font-size:16px}main{padding:30px 16px 60px}.card{min-height:220px}}
</style></head><body>
<header><div class="brand">✦ VITANOVA LEARNING HUB</div><h1>Welcome to Vitanova</h1><p>Your home for lectures, learning resources, and interactive study materials.<br>Choose an artifact below to get started.</p><div class="pill">One place for every resource</div></header>
<main><div id="back-area"></div><div class="heading"><div><div class="eyebrow">YOUR LIBRARY</div><h2 id="page-title">Explore your artifacts</h2></div><div class="count" id="count"></div></div><div id="cards" class="grid"></div></main><footer>Vitanova Learning Hub · Study resources</footer>
<script>
/* ADD NEW LECTURES HERE. Copy one line, edit title/description/file/category.
   category choices: mss-mid-anatomy, mss-mid-pharmacology, mss-mid-physiology,
   mss-mid-pathology, mss-mid-microbiology, mss-final-anatomy,
   mss-final-pharmacology, mss-final-physiology, mss-final-pathology,
   mss-final-microbiology, mss-final-biochemistry, mss-past-mid, mss-past-final,
   immunology-mid, immunology-final.
   Example: {category:'mss-mid-anatomy',title:'Lecture 9 — Example',description:'Summary and MCQs',file:'my-lecture.html'},
*/
const lectures = [
 {category:'immunology-mid',title:'Introduction to Medical Immunology',description:'Lecture 1 · Full slide explanation, summary and interactive MCQs.',file:'immunology-lecture-1.html',icon:'🧬'},
 {category:'mss-mid-anatomy',title:'Skull & TMJ Revision',description:'Lectures 1 & 2 · Summary and MCQs.',file:"MSS anatomy Skull & TMJ summary +MCQ's.html",icon:'🦴'},
 {category:'mss-mid-anatomy',title:'Bones, Curves & Neural Content — Joints, Ligaments & Muscles',description:'Lectures 3 & 4 · Summary and MCQs.',file:'MSS-Anatomy-Lectures-3-4.html',icon:'🦴'},
 {category:'mss-mid-anatomy',title:'Upper Limb Bones & Joints',description:'Lectures 5 & 6 · Summary and MCQs.',file:'MSS-Anatomy-Lectures-5-6.html',icon:'🦴'}
];
// Add Lectures 7 & 8 when you know the exact uploaded filename:
// {category:'mss-mid-anatomy',title:'Upper Limb Joints, Muscles & Axilla',description:'Lectures 7 & 8 · Summary and 32 MCQs.',file:'EXACT-FILENAME.html',icon:'💪'},
const categories = {
 'mss-mid':[['anatomy','Anatomy','🦴'],['pharmacology','Pharmacology','💊'],['physiology','Physiology','❤️'],['pathology','Pathology','🔬'],['microbiology','Microbiology','🦠']],
 'mss-final':[['anatomy','Anatomy','🦴'],['pharmacology','Pharmacology','💊'],['physiology','Physiology','❤️'],['pathology','Pathology','🔬'],['microbiology','Microbiology','🦠'],['biochemistry','Biochemistry','🧪']]
};
const views={
 home:{title:'Explore your artifacts',parent:null,cards:[['MSS System','Midterm, final, and past papers, organized by subject.','mss','🦴','SYSTEM'],['Immunology','Full slide explanations, AI summaries and MCQs.','immunology','🧬','SYSTEM']]},
 mss:{title:'MSS System',parent:'home',cards:[['Midterm Summary + AI MCQs','Study materials organized by subject.','mss-mid','📘','MIDTERM'],['Final Summary + AI MCQs','Study materials organized by subject.','mss-final','📗','FINAL'],['Past Papers','Midterm and final question collections.','mss-past','📝','PAST PAPERS']]},
 immunology:{title:'Immunology',parent:'home',cards:[['Midterm','Full slide explanations + AI summaries and MCQs.','immunology-mid','🧬','MIDTERM'],['Final','Full slide explanations + AI summaries and MCQs.','immunology-final','🧬','FINAL']]},
 'mss-past':{title:'MSS Past Papers',parent:'mss',cards:[['Midterm Questions','Past-paper questions for the midterm.','mss-past-mid','📝','PAST PAPERS'],['Final Questions','Past-paper questions for the final.','mss-past-final','📝','PAST PAPERS']]}
};
for(const [exam,subjects] of Object.entries(categories)){
 views[exam]={title:(exam==='mss-mid'?'MSS Midterm':'MSS Final')+' · Choose a subject',parent:'mss',cards:subjects.map(([id,title,icon])=>[title,'Browse '+title.toLowerCase()+' lectures and quizzes.',exam+'-'+id,icon,'SUBJECT'])};
 for(const [id,title] of subjects)views[exam+'-'+id]={title:(exam==='mss-mid'?'MSS Midterm':'MSS Final')+' · '+title,parent:exam,category:exam+'-'+id};
}
for(const id of ['immunology-mid','immunology-final'])views[id]={title:'Immunology · '+(id.endsWith('mid')?'Midterm':'Final'),parent:'immunology',category:id};
for(const id of ['mss-past-mid','mss-past-final'])views[id]={title:'MSS Past Papers · '+(id.endsWith('mid')?'Midterm':'Final'),parent:'mss-past',category:id};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const key=decodeURIComponent(location.hash.slice(1))||'home';const view=views[key]||views.home;document.getElementById('page-title').textContent=view.title;document.getElementById('back-area').innerHTML=view.parent?`<a class="back" href="#${view.parent}">← Back</a>`:'';const cards=view.cards?view.cards.map(([title,description,to,icon,tag])=>({title,description,to,icon,tag})):lectures.filter(x=>x.category===view.category).map(x=>({...x,tag:'LECTURE'}));document.getElementById('count').textContent=cards.length+' '+(cards.length===1?'resource':'resources');document.getElementById('cards').innerHTML=cards.length?cards.map(c=>`<article class="card"><div class="icon">${esc(c.icon||'📚')}</div><span class="tag">${esc(c.tag)}</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><a class="action" href="${c.to?'#'+encodeURIComponent(c.to):encodeURI(c.file).replace(/#/g,'%23').replace(/\?/g,'%3F')}" ${c.file?'':' '} >${c.to?'Explore':'Open lecture'} →</a></article>`).join(''):'<div class="empty">No resources uploaded here yet. New lectures will appear in this section when added.</div>';}
window.addEventListener('hashchange',render);render();
</script></body></html>
