<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitanova · MSS and Immunology flashcards</title>
<style>
:root{color-scheme:light dark;--bg:#f2f5f9;--card:#fff;--ink:#17243a;--muted:#4b5e75;--line:#d6dfe9;--blue:#2459a7;--soft:#e9f1fc}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#192337;--ink:#eef4ff;--muted:#b8c6dd;--line:#34435e;--blue:#a8c8ff;--soft:#253754}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:24px clamp(12px,3vw,28px) 48px}
header{margin-bottom:20px}header p{margin:0;color:var(--muted)}h1{font:700 clamp(1.8rem,5vw,2.8rem)/1.12 Georgia,serif;margin:.22em 0}h2{font:700 clamp(1.28rem,4vw,1.75rem)/1.25 Georgia,serif;margin:.7em 0}
.header-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.header-links a{display:inline-flex;align-items:center;gap:.45em;min-height:40px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.88rem;font-weight:650;text-decoration:none}
.header-links a:hover{background:var(--soft);border-color:var(--blue)}
a{color:var(--blue)}button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}button{cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}label{font-size:.84rem;color:var(--muted);display:grid;gap:3px}
.filters,.actions,.ratings{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.filters{margin-bottom:12px}.filters button{min-height:43px}.primary{background:var(--soft);border-color:var(--blue);color:var(--blue);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,4vw,30px);margin:12px 0}.meta{color:var(--muted);font-size:.86rem;margin:0}.answer{margin:14px 0;padding:12px;border-inline-start:3px solid var(--blue);background:var(--soft);border-radius:6px;font-weight:600}.actions{margin-top:14px}.ratings button{flex:1 1 115px}.ratings button span{display:block;font-size:.76rem;color:var(--muted)}
.figure{display:block;max-width:430px;margin:12px 0}.figure img{display:block;width:100%;border-radius:8px;border:1px solid var(--line)}.figure small{color:var(--muted)}
.cloze{color:var(--blue);background:var(--soft);border-radius:4px;padding:0 .2em}
.badge{display:inline-block;color:var(--blue);background:var(--soft);border-radius:5px;padding:0 .4em;margin-inline-start:6px;font-weight:700}
details summary{cursor:pointer;font-weight:700}details p{margin-bottom:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:8px 0 20px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--soft)}[hidden]{display:none!important}footer{font-size:.86rem;color:var(--muted);margin-top:16px}
label{min-width:0;max-width:100%;grid-template-columns:minmax(0,1fr)}label select{min-width:0}
</style></head><body><main>
<header>
  <nav class="header-links" aria-label="Flashcard navigation">
    <a href="index.html"><span aria-hidden="true">←</span> Vitanova Learning Hub</a>
    <a id="return-to-lecture" hidden><span aria-hidden="true">←</span> Back to lecture</a>
  </nav>
  <h1>Study flashcards</h1>
  <p>MSS Midterm and Final · Immunology Midterm · Practical labs</p>
</header>
<div class="filters">
<label>Exam<select id="exam"><option value="mid">Midterm</option><option value="final">Final and labs</option><option value="">All materials</option></select></label>
<label>Lecture or lab<select id="lecture"><option value="">All materials</option></select></label>
<label>Topic<select id="topic"></select></label>
<label>Cards<select id="origin"><option value="">All cards</option><option value="anking">AnKing only</option><option value="original">Course cards only</option></select></label>
<label>Cards per session<select id="session-size"><option value="">All available cards</option></select></label>
<button id="start" type="button">Study Now</button><button id="start-linked" class="primary" type="button" hidden></button></div>
<section class="panel" aria-label="Deck overview">
<p class="meta" id="counts"></p>
<div class="actions"><button id="reset" type="button">Reset deck progress</button></div><p class="meta" id="reset-status" role="status"></p>
</section>
<div class="panel" id="study" hidden>
<p class="meta" id="progress-text" aria-live="polite"></p>
<p class="meta" id="source"></p><h2 id="question" tabindex="-1"></h2>
<a class="figure" id="figure" target="_blank" rel="noopener" hidden><img id="image" alt=""><small id="image-caption"></small></a>
<div id="answer" class="answer" hidden></div>
<div id="ratings" class="ratings" hidden aria-label="Rate recall"></div>
<div class="actions"><button id="reveal" class="primary" type="button">Show answer</button></div>
<p class="meta" id="shortcut">Space to show answer · 1 Again · 2 Hard · 3 Good · 4 Easy</p>
</div>

<footer>Progress is stored in this browser when storage is available. Slide references use PDF page numbers.
</footer>
</main><script src="study-srs.js?v=session-size"></script><script src="data/flashcards/course-deck.js?v=related-lab-decks"></script><script src="study-srs-page.js?v=session-size"></script></body></html>
